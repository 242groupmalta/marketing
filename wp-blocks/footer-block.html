<style>
  @font-face{
    font-family:'George';
    src:url('https://hardrockmalta.rsvp/wp-content/uploads/fonts/George-Light.otf') format('opentype');
    font-weight:300;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'George';
    src:url('https://hardrockmalta.rsvp/wp-content/uploads/fonts/George-Semibold.otf') format('opentype');
    font-weight:600;
    font-style:normal;
    font-display:swap;
  }
  @font-face{
    font-family:'George';
    src:url('https://hardrockmalta.rsvp/wp-content/uploads/fonts/George-Bold.otf') format('opentype');
    font-weight:700;
    font-style:normal;
    font-display:swap;
  }

  .hrh-footer{
    --ink:#0d201b;
    --ink-2:#132a23;
    --gold:#c79a4b;
    --gold-light:#e3c583;
    --line: rgba(199,154,75,0.35);
  }
  .hrh-footer, .hrh-footer *{ box-sizing:border-box; }
  .hrh-footer a{ color:inherit; text-decoration:none; }

  .hrh-footer{
    background: var(--ink);
    color:#e4dcc7;
    font-family:'George', sans-serif;
    font-weight:300;
    padding: 3rem 3rem 2rem;
    position:relative;
    overflow:hidden;
  }
  .hrh-footer .footer-main{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:2rem;
  }
  .hrh-footer .footer-legal{
    margin-top:2.4rem;
    padding-top:1.6rem;
    border-top:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-wrap:wrap;
    gap:0.7rem;
  }
  .hrh-footer .footer-legal a{
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:#cfc6ac;
    transition: color .2s ease;
  }
  .hrh-footer .footer-legal a:hover{ color:var(--gold-light);}
  .hrh-footer .footer-legal .dot-sep{ color:var(--gold); font-size:0.7rem;}

  .hrh-footer .footer-brand{ display:flex; align-items:center; gap:1.6rem;}
  .hrh-footer .footer-badge img{
    width:120px;
    height:auto;
    display:block;
  }

  .hrh-footer .footer-social{ display:flex; gap:0.8rem;}
  .hrh-footer .footer-social a{
    width:38px; height:38px;
    border-radius:50%;
    background: var(--gold);
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    transition: transform .25s ease, background .25s ease;
  }
  .hrh-footer .footer-social a:hover{ transform:translateY(-3px); background:var(--gold-light);}
  .hrh-footer .footer-social svg{ width:18px; height:18px;}
  .hrh-footer .footer-social .icon-stroke{ fill:none !important; stroke:#0d201b !important; }
  .hrh-footer .footer-social .icon-fill{ fill:#0d201b !important; stroke:none !important; }

  .hrh-footer .footer-map{
    flex:1;
    max-width:420px;
    min-width:260px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .hrh-footer .footer-map iframe{
    display:block;
    width:100%;
    height:220px;
    border:0;
  }
  .hrh-footer .footer-map-fallback{
    display:block;
    padding:0.7rem 1rem;
    text-align:center;
    font-size:0.78rem;
    letter-spacing:0.04em;
    color:var(--gold-light);
    background: var(--ink-2);
  }
  .hrh-footer .footer-map-fallback:hover{ color:var(--gold);}

  .hrh-footer .footer-cross{
    position:absolute;
    right:-60px; bottom:-90px;
    width:260px; height:260px;
    opacity:0.14;
    pointer-events:none;
  }

  @media (max-width: 980px){
    .hrh-footer .footer-main{ flex-direction:column; text-align:center;}
    .hrh-footer .footer-map{ max-width:100%; width:100%;}
  }

  @media (prefers-reduced-motion: reduce){
    .hrh-footer *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important;}
  }
</style>

<footer class="hrh-footer">
  <div class="footer-cross">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
      <g transform="translate(100,100)" fill="#c79a4b">
        <path d="M0,0 L 55,-55 L 6,-14 Z"/><path d="M0,0 L 55,-55 L 14,-6 Z" opacity="0.75"/>
        <path d="M0,0 L 55,-55 L 6,-14 Z" transform="rotate(90)"/><path d="M0,0 L 55,-55 L 14,-6 Z" transform="rotate(90)" opacity="0.75"/>
        <path d="M0,0 L 55,-55 L 6,-14 Z" transform="rotate(180)"/><path d="M0,0 L 55,-55 L 14,-6 Z" transform="rotate(180)" opacity="0.75"/>
        <path d="M0,0 L 55,-55 L 6,-14 Z" transform="rotate(270)"/><path d="M0,0 L 55,-55 L 14,-6 Z" transform="rotate(270)" opacity="0.75"/>
      </g>
    </svg>
  </div>

  <div class="footer-main">
    <div class="footer-brand">
      <div class="footer-badge">
        <img src="https://hardrockmalta.rsvp/wp-content/uploads/2026/08/HRH-Malta_Logo_1C_1R_Wht.png" alt="Hard Rock Hotel Malta">
      </div>
      <div class="footer-social">
        <a href="https://www.instagram.com/hardrockhotelmalta/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" stroke-width="1.8"><rect class="icon-stroke" x="3.5" y="3.5" width="17" height="17" rx="4.5"/><circle class="icon-stroke" cx="12" cy="12" r="4"/><circle class="icon-fill" cx="17.2" cy="6.8" r="0.6"/></svg></a>
        <a href="https://www.facebook.com/hardrockhotelmalta/" target="_blank" rel="noopener" aria-label="Facebook"><svg viewBox="0 0 24 24"><path class="icon-fill" d="M13.5 21v-8h2.7l.4-3.1h-3.1V8c0-.9.25-1.5 1.55-1.5H16.7V3.7C16.4 3.65 15.4 3.5 14.3 3.5c-2.3 0-3.9 1.4-3.9 4v2.4H7.7V13h2.7v8h3.1z"/></svg></a>
      </div>
    </div>

    <div class="footer-map">
      <iframe
        src="https://www.google.com/maps?q=Hard+Rock+Hotel+Malta,+Triq+il-Professur+Walter+Ganado,+St+George's+Bay,+St+Julian's&output=embed"
        allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"
        title="Hard Rock Hotel Malta location"></iframe>
      <a class="footer-map-fallback" href="https://www.google.com/maps/search/?api=1&query=Hard+Rock+Hotel+Malta+Triq+il-Professur+Walter+Ganado+St+George%27s+Bay+St+Julian%27s" target="_blank" rel="noopener">Open in Google Maps &rarr;</a>
    </div>
  </div>

  <div class="footer-legal">
    <a href="https://hotel.hardrock.com/privacy.aspx" target="_blank" rel="noopener">Privacy Policy</a>
    <span class="dot-sep">&bull;</span>
    <a href="https://hotel.hardrock.com/legal-disclaimer.aspx" target="_blank" rel="noopener">Legal Disclaimer</a>
    <span class="dot-sep">&bull;</span>
    <a href="https://www.hardrock.com/ccpa.aspx?_gl=1*nu8g0k*_gcl_au*MTcyMzI3NDA2OC4xNzg1NzU2NjI2" target="_blank" rel="noopener">CCPA</a>
  </div>
</footer>
