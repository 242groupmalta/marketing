<style>
  .wbm-footer{
    --navy:#1c244b;
    --navy-deep:#10152e;
    --accent:#477ff7;
    --ink:#1c244b;
    --muted:#aab1c9;
    --line:rgba(255,255,255,0.1);
    background:var(--navy);
    color:#eef0f7;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }

  .wbm-footer-inner{
    max-width:1240px;
    margin:0 auto;
    padding:3.5rem 1.5rem 2rem;
    display:grid;
    grid-template-columns:1.2fr 1.2fr 1fr 1fr;
    gap:2.5rem;
  }

  .wbm-footer-brand .wbm-logo{
    display:inline-flex;
    align-items:center;
    text-decoration:none;
    color:#fff;
  }
  .wbm-footer-brand .wbm-logo-img{
    display:block;
    height:42px;
    width:auto;
    /* Source file is dark line-art on a transparent background — force it
       white so it reads on this dark navy footer. If you have a dedicated
       white/light logo variant, swap the src below and drop this filter. */
    filter:brightness(0) invert(1);
  }

  .wbm-footer-col h4{
    font-size:0.85rem;
    text-transform:uppercase;
    letter-spacing:0.08em;
    color:#fff;
    margin:0 0 1.1rem;
  }
  .wbm-footer-col ul{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:0.7rem; }
  .wbm-footer-col a{
    color:var(--muted);
    text-decoration:none;
    font-size:0.92rem;
    transition:color .2s ease;
  }
  .wbm-footer-col a:hover{ color:var(--accent); }

  .wbm-footer-contact address{
    font-style:normal;
    color:var(--muted);
    font-size:0.92rem;
    line-height:1.7;
    margin-top:0.9rem;
  }
  .wbm-footer-contact address strong{ color:#fff; font-weight:600; }

  .wbm-footer-bottom{
    border-top:1px solid var(--line);
    padding:1.4rem 1.5rem;
  }
  .wbm-footer-bottom-inner{
    max-width:1240px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:0.8rem;
  }
  .wbm-footer-bottom p{ margin:0; color:var(--muted); font-size:0.82rem; }

  @media (max-width:900px){
    .wbm-footer-inner{ grid-template-columns:1fr 1fr; gap:2.5rem 1.5rem; }
    .wbm-footer-brand{ grid-column:1 / -1; }
  }
  @media (max-width:560px){
    .wbm-footer-inner{ grid-template-columns:1fr; }
    .wbm-footer-bottom-inner{ flex-direction:column; align-items:flex-start; }
  }
